<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" fill="none" class="avari-logo">
  <defs>
    <!-- Gold Linear Gradients -->
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F0D48D"/>
      <stop offset="50%" stop-color="#D9B96E"/>
      <stop offset="100%" stop-color="#A98A48"/>
    </linearGradient>
    <linearGradient id="goldLightGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#D9B96E"/>
      <stop offset="50%" stop-color="#FFF3D1"/>
      <stop offset="100%" stop-color="#D9B96E"/>
    </linearGradient>
    <linearGradient id="tealGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0F3847"/>
      <stop offset="50%" stop-color="#0A2733"/>
      <stop offset="100%" stop-color="#061A22"/>
    </linearGradient>
    <linearGradient id="dieFacet1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F0D48D"/>
      <stop offset="100%" stop-color="#A98A48"/>
    </linearGradient>
    <linearGradient id="dieFacet2" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#144A5E"/>
      <stop offset="100%" stop-color="#0A242E"/>
    </linearGradient>
    <linearGradient id="dieFacet3" x1="50%" y1="0%" x2="50%" y2="100%">
      <stop offset="0%" stop-color="#55C878"/>
      <stop offset="100%" stop-color="#1B6D43"/>
    </linearGradient>

    <!-- Filters for Magical Glow -->
    <filter id="goldGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Left Elven Arch of 'A' -->
  <path d="M100 22 C92 46, 68 85, 45 130 C34 152, 22 170, 14 182 C28 172, 44 158, 56 142 C72 120, 88 88, 98 48 Z" 
        fill="url(#tealGrad)" stroke="url(#goldGrad)" stroke-width="1.8"/>

  <!-- Left Outer Gold Fin / Leaf Wing -->
  <path d="M96 24 C82 60, 56 112, 20 178 C36 150, 62 98, 86 46 Z" 
        fill="url(#goldGrad)" opacity="0.95"/>

  <!-- Right Elven Arch of 'A' -->
  <path d="M100 22 C108 46, 132 85, 155 130 C166 152, 178 170, 186 182 C172 172, 156 158, 144 142 C128 120, 112 88, 102 48 Z" 
        fill="url(#tealGrad)" stroke="url(#goldGrad)" stroke-width="1.8"/>

  <!-- Right Outer Gold Fin / Leaf Wing -->
  <path d="M104 24 C118 60, 144 112, 180 178 C164 150, 138 98, 114 46 Z" 
        fill="url(#goldGrad)" opacity="0.95"/>

  <!-- Top Crown Horns -->
  <path d="M100 22 C94 14, 82 8, 74 6 C84 12, 94 20, 100 28 C106 20, 116 12, 126 6 C118 8, 106 14, 100 22 Z" 
        fill="url(#goldLightGrad)" filter="url(#goldGlow)"/>

  <!-- Horizontal Cross-Arch of the 'A' (Tabletop Bridge) -->
  <path d="M62 135 C86 120, 114 120, 138 135 C122 144, 78 144, 62 135 Z" 
        fill="url(#tealGrad)" stroke="url(#goldGrad)" stroke-width="1.5"/>

  <!-- Inner Centerpiece: Tabletop Polyhedral Die (d20 / Icosahedron) with Gold Filigree -->
  <g transform="translate(100, 108)">
    <!-- Outer Die Glow Aura -->
    <circle cx="0" cy="0" r="22" fill="#D9B96E" opacity="0.12" filter="url(#goldGlow)"/>

    <!-- Central Icosahedron Faces -->
    <!-- Top Central Triangle -->
    <polygon points="0,-18 -15,-6 15,-6" fill="url(#dieFacet1)" stroke="url(#goldLightGrad)" stroke-width="1.2"/>
    <!-- Center Inverted Triangle -->
    <polygon points="-15,-6 15,-6 0,16" fill="url(#dieFacet2)" stroke="url(#goldLightGrad)" stroke-width="1.2"/>
    <!-- Left Top Face -->
    <polygon points="0,-18 -18,-14 -15,-6" fill="url(#dieFacet2)" stroke="url(#goldGrad)" stroke-width="1"/>
    <!-- Right Top Face -->
    <polygon points="0,-18 18,-14 15,-6" fill="url(#dieFacet1)" stroke="url(#goldGrad)" stroke-width="1"/>
    <!-- Left Flank Face -->
    <polygon points="-18,-14 -20,6 -15,-6" fill="url(#dieFacet1)" stroke="url(#goldGrad)" stroke-width="1"/>
    <!-- Right Flank Face -->
    <polygon points="18,-14 20,6 15,-6" fill="url(#dieFacet2)" stroke="url(#goldGrad)" stroke-width="1"/>
    <!-- Left Bottom Face -->
    <polygon points="-20,6 0,16 -15,-6" fill="url(#dieFacet2)" stroke="url(#goldGrad)" stroke-width="1"/>
    <!-- Right Bottom Face -->
    <polygon points="20,6 0,16 15,-6" fill="url(#dieFacet1)" stroke="url(#goldGrad)" stroke-width="1"/>
    <!-- Bottom Tip Face -->
    <polygon points="-20,6 0,16 0,22" fill="url(#dieFacet1)" stroke="url(#goldGrad)" stroke-width="0.8"/>
    <polygon points="20,6 0,16 0,22" fill="url(#dieFacet2)" stroke="url(#goldGrad)" stroke-width="0.8"/>

    <!-- Central Micro Rune / Star Spark in the Die -->
    <polygon points="0,-1 2,4 0,9 -2,4" fill="#FFF3D1" filter="url(#goldGlow)"/>
    <polygon points="-4,4 1,3 6,4 1,5" fill="#FFF3D1" filter="url(#goldGlow)"/>
  </g>

  <!-- Lower flourishes / roots -->
  <path d="M46 142 C38 152, 28 162, 14 182 C24 180, 42 168, 52 152 Z" fill="url(#goldGrad)"/>
  <path d="M154 142 C162 152, 172 162, 186 182 C176 180, 158 168, 148 152 Z" fill="url(#goldGrad)"/>
</svg>
