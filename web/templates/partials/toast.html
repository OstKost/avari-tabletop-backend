{{define "toast"}}
<div x-data="{ show: true }"
     x-init="setTimeout(() => show = false, 4000)"
     x-show="show"
     x-transition:enter="transition ease-out duration-300"
     x-transition:enter-start="opacity-0 translate-x-4 scale-95"
     x-transition:enter-end="opacity-100 translate-x-0 scale-100"
     x-transition:leave="transition ease-in duration-200"
     x-transition:leave-start="opacity-100 scale-100"
     x-transition:leave-end="opacity-0 scale-95"
     class="flex items-center gap-3 p-3.5 rounded-2xl shadow-elven-modal border backdrop-blur-md bg-avari-surface/95
     {{if eq .Type "error"}}border-avari-rose/40 shadow-[0_0_15px_rgba(217,104,104,0.15)]
     {{else if eq .Type "success"}}border-avari-emerald/40 shadow-[0_0_15px_rgba(85,200,120,0.15)]
     {{else}}border-avari-cyan/40 shadow-[0_0_15px_rgba(110,168,196,0.15)]{{end}}">
    <div class="w-8 h-8 rounded-xl flex items-center justify-center text-sm flex-shrink-0
         {{if eq .Type "error"}}bg-avari-rose/15 text-avari-rose
         {{else if eq .Type "success"}}bg-avari-emerald/15 text-avari-emerald
         {{else}}bg-avari-cyan/15 text-avari-cyan{{end}}">
        {{if eq .Type "error"}}⚠️{{else if eq .Type "success"}}✅{{else}}ℹ️{{end}}
    </div>
    <p class="text-xs font-medium text-avari-text-primary flex-1 leading-snug">{{.Message}}</p>
    <button @click="show = false" class="text-avari-text-muted hover:text-avari-text-primary p-1 rounded-lg transition-colors ml-1 focus:outline-none" title="Закрыть">
        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"/>
        </svg>
    </button>
</div>
{{end}}
